name: comware-static-site
static_sites:
  - name: web
    source_dir: /
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    environment_slug: html
    index_document: index.html
functions:
  - name: comwaretechs-functions
    source_dir: /functions
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    envs:
      - key: SMTP_HOST
        value: smtpout.secureserver.net
        scope: RUN_TIME
        type: GENERAL
      - key: SMTP_PORT
        value: "587"
        scope: RUN_TIME
        type: GENERAL
      - key: SMTP_USERNAME
        value: contactus@comwaretechs.com
        scope: RUN_TIME
        type: GENERAL
      # Value is set in the DigitalOcean dashboard, never committed.
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: CONTACT_TO
        value: contactus@comwaretechs.com
        scope: RUN_TIME
        type: GENERAL
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: comwaretechs-functions
    - match:
        path:
          prefix: /
      component:
        name: web
domains:
  - domain: comwaretechs.com
    type: PRIMARY
    zone: comwaretechs.com
