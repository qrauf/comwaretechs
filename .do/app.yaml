name: comware-static-site
static_sites:
  - name: web
    source_dir: /
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    environment_slug: html
    index_document: index.html
    # Serves the home page for /about, /contact (and unknown paths).
    catchall_document: index.html
functions:
  - name: comwaretechs-functions
    source_dir: /functions
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    envs:
      # Set the real value in the DigitalOcean dashboard, never commit it.
      - key: SMTP_PASSWORD
        value: PASTE_YOUR_EMAIL_PASSWORD_HERE
        scope: RUN_AND_BUILD_TIME
        type: SECRET
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: comwaretechs-functions
    # /aws, /azure and /gcp show the cloud partners page (URL is kept).
    - match:
        path:
          prefix: /aws
      component:
        name: web
        rewrite: /cloud-partners/
    - match:
        path:
          prefix: /azure
      component:
        name: web
        rewrite: /cloud-partners/
    - match:
        path:
          prefix: /gcp
      component:
        name: web
        rewrite: /cloud-partners/
    # /strategy, /migration, ... show the services page (URL is kept).
    - match:
        path:
          prefix: /strategy
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /migration
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /infrastructure
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /security
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /automation
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /support
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /data
      component:
        name: web
        rewrite: /services/
    - match:
        path:
          prefix: /optimization
      component:
        name: web
        rewrite: /services/
    # /agentic-ai, /generative-ai, ... show the AI services page (URL is kept).
    - match:
        path:
          prefix: /agentic-ai
      component:
        name: web
        rewrite: /ai-services/
    - match:
        path:
          prefix: /generative-ai
      component:
        name: web
        rewrite: /ai-services/
    - match:
        path:
          prefix: /assessment
      component:
        name: web
        rewrite: /ai-services/
    - match:
        path:
          prefix: /big-data
      component:
        name: web
        rewrite: /ai-services/
    - match:
        path:
          prefix: /whitepaper
      component:
        name: web
        rewrite: /ai-services/
    - match:
        path:
          prefix: /
      component:
        name: web
domains:
  - domain: comwaretechs.com
    type: PRIMARY
    zone: comwaretechs.com
