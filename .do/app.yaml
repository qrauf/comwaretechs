name: comware-static-site
static_sites:
  - name: web
    source_dir: /
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    environment_slug: html
    index_document: index.html
    # Serves the home page for /about, /contact (and unknown paths).
    catchall_document: index.html
functions:
  - name: comwaretechs-functions
    source_dir: /functions
    github:
      repo: qrauf/comwaretechs
      branch: logo-update
      deploy_on_push: true
    envs:
      # Set the real value in the DigitalOcean dashboard, never commit it.
      - key: SMTP_PASSWORD
        value: PASTE_YOUR_EMAIL_PASSWORD_HERE
        scope: RUN_AND_BUILD_TIME
        type: SECRET
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: comwaretechs-functions
    - match:
        path:
          prefix: /
      component:
        name: web
domains:
  - domain: comwaretechs.com
    type: PRIMARY
    zone: comwaretechs.com
