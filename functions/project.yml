packages:
  - name: contact
    functions:
      - name: submit
        runtime: php:8.4
        web: true
        limits:
          timeout: 10000
        environment:
          SMTP_HOST: "${SMTP_HOST}"
          SMTP_PORT: "${SMTP_PORT}"
          SMTP_USERNAME: "${SMTP_USERNAME}"
          SMTP_PASSWORD: "${SMTP_PASSWORD}"
          CONTACT_TO: "${CONTACT_TO}"
