    <path d="M172 474L488 428L803 474L488 536L172 474Z" fill="url(#platform)"/>
    <path d="M207 489L488 447L768 489L488 517L207 489Z" fill="#E1FFFF" fill-opacity="0.28"/>
    <path d="M220 505L488 548L756 505L728 617L488 675L248 617L220 505Z" fill="url(#base)"/>
    <path d="M264 557L488 603L712 557" stroke="#57DCE7" stroke-opacity="0.45" stroke-width="5"/>
    <path d="M281 593L488 634L695 593" stroke="#57DCE7" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M331 536L331 638M390 548L390 652M586 548L586 652M645 536L645 638" stroke="#6DE8E2" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <circle cx="167" cy="173" r="4" fill="#B6FFFA"/>
  <circle cx="789" cy="202" r="5" fill="#6DE8E2"/>
  <circle cx="741" cy="112" r="3" fill="#D7FFFF"/>
  <circle cx="221" cy="299" r="3" fill="#6DE8E2"/>
